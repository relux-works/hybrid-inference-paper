# Paper CI. Every pull request and push to main builds the PDF as a workflow artifact.
# A tag vX.Y.Z on main publishes a GitHub Release with that PDF and SHA256SUMS.
# See README.md, section "Versions and releases".
name: paper

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on:
      group: swarma-private
      labels: [self-hosted, Linux, X64, swarma-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check runner tools
        run: |
          for t in git make curl tar; do
            command -v "$t" >/dev/null || { echo "::error::$t is missing on the runner"; exit 1; }
          done

      - name: Test the release scripts
        run: .scripts/test-release.sh

      - name: Check the release tag
        if: github.ref_type == 'tag'
        run: .scripts/release-check.sh "$GITHUB_REF_NAME"

      - name: Install tectonic
        run: .scripts/install-tectonic.sh >> "$GITHUB_PATH"

      - name: Build the PDF
        run: make pdf

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper-pdf
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on:
      group: swarma-private
      labels: [self-hosted, Linux, X64, swarma-ci]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release tag and extract its notes
        run: .scripts/release-check.sh "$GITHUB_REF_NAME" release-notes.md

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paper-pdf
          path: dist

      - name: Publish the GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const tag = process.env.GITHUB_REF_NAME;
            const prerelease = tag.includes('-');
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const notes = fs.readFileSync('release-notes.md', 'utf8').trim();
            const body = `${notes}\n\nBuilt from ${context.sha} by [workflow run ${context.runId}](${run}). ` +
              'Check downloads against `SHA256SUMS`.\n';

            // A published version is never rebuilt or replaced: fix forward with a new version.
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.setFailed(`Release ${tag} is already published.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            // A draft left by an earlier failed run of this tag was never visible to readers.
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            for (const old of releases.filter((r) => r.draft && r.tag_name === tag)) {
              await github.rest.repos.deleteRelease({ owner, repo, release_id: old.id });
            }

            // Upload into a draft, then publish, so no reader sees a release without its files.
            const { data: draft } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: tag, body, draft: true, prerelease,
            });
            for (const name of fs.readdirSync('dist').sort()) {
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: draft.id, name,
                data: fs.readFileSync(path.join('dist', name)),
                headers: { 'content-type': name.endsWith('.pdf') ? 'application/pdf' : 'text/plain' },
              });
            }
            const { data: release } = await github.rest.repos.updateRelease({
              owner, repo, release_id: draft.id, draft: false, make_latest: prerelease ? 'false' : 'true',
            });
            core.notice(`Published ${release.html_url}`);
